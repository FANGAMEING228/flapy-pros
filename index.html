<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flapy Pros</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;font-family:sans-serif;}
  #gameCanvas{display:block;position:fixed;top:0;left:0;touch-action:none;}
  #err{display:none;position:fixed;top:0;left:0;right:0;background:#b00020;color:#fff;font:12px monospace;padding:6px 10px;z-index:99999;white-space:pre-wrap;}
  .overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);color:#fff;z-index:500;text-align:center;}
  .hidden{display:none !important;}
  h1{font-size:42px;margin:0 0 10px;text-shadow:2px 2px 0 #000;}
  .bigBtn{font-size:22px;padding:14px 30px;margin:8px;border:none;border-radius:10px;background:#ffcc00;color:#222;font-weight:bold;cursor:pointer;}
  .bigBtn:active{transform:scale(0.96);}
  #gearBtn{position:fixed;bottom:14px;right:14px;z-index:600;font-size:26px;background:rgba(0,0,0,0.4);border:none;border-radius:50%;width:48px;height:48px;color:#fff;cursor:pointer;}
  #fsBtn{position:fixed;bottom:14px;left:14px;z-index:600;font-size:22px;background:rgba(0,0,0,0.4);border:none;border-radius:50%;width:48px;height:48px;color:#fff;cursor:pointer;}
  #pinModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:900;display:flex;align-items:center;justify-content:center;}
  #pinBox{background:#222;padding:24px;border-radius:12px;text-align:center;color:#fff;}
  #pinBox input{font-size:24px;text-align:center;width:140px;padding:8px;border-radius:8px;border:none;margin:10px 0;}
  #pinErr{color:#ff5555;font-size:13px;height:16px;}
  #adminPanel{position:fixed;top:0;right:-360px;width:340px;height:100%;background:#1b1b1f;color:#fff;z-index:800;transition:right 0.25s;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,0.5);}
  #adminPanel.open{right:0;}
  #adminHeader{padding:12px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;}
  #adminTabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#111;position:sticky;top:42px;z-index:2;max-height:160px;overflow-y:auto;}
  .tabBtn{background:#333;border:none;color:#ccc;padding:6px 8px;border-radius:6px;font-size:10px;cursor:pointer;}
  .tabBtn.active{background:#ffcc00;color:#222;font-weight:bold;}
  .ctrlRow{padding:8px 12px;border-bottom:1px solid #2c2c33;}
  .ctrlRow label{display:block;font-size:12px;margin-bottom:4px;color:#ccc;}
  .ctrlRow input[type=range]{width:100%;}
  .ctrlRow input[type=color]{width:50px;height:28px;border:none;}
  .ctrlRow select, .ctrlRow input[type=text]{width:100%;padding:4px;border-radius:4px;border:none;}
  .valSpan{float:right;color:#ffcc00;font-size:11px;}
  .actionBtn{background:#444;color:#fff;border:none;padding:8px;border-radius:6px;margin:4px;cursor:pointer;font-size:12px;}
  .closeBtn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  #skinsScreen, #onlineScreen{position:fixed;inset:0;background:rgba(10,10,15,0.95);z-index:700;display:flex;flex-direction:column;align-items:center;color:#fff;overflow-y:auto;padding:20px 10px 40px;}
  #skinGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;width:100%;max-width:700px;margin-top:16px;}
  .skinCard{background:#222;border-radius:10px;padding:8px;cursor:pointer;border:2px solid transparent;text-align:center;}
  .skinCard.selected{border-color:#ffcc00;}
  .skinCard.locked{opacity:0.4;}
  .skinCard canvas{display:block;margin:0 auto;}
  .skinCard div{font-size:11px;margin-top:4px;}
  #fpsHud{position:fixed;top:6px;left:6px;color:#0f0;font:12px monospace;z-index:550;background:rgba(0,0,0,0.4);padding:3px 6px;border-radius:4px;}
  #debugHud{position:fixed;top:28px;left:6px;color:#0ff;font:11px monospace;white-space:pre;z-index:550;background:rgba(0,0,0,0.5);padding:5px 7px;border-radius:4px;}
  #statsHud{position:fixed;top:6px;right:6px;color:#fff;font:11px monospace;white-space:pre;z-index:550;background:rgba(0,0,0,0.4);padding:5px 7px;border-radius:4px;text-align:right;}
  #onlineArea textarea{width:100%;height:60px;font-size:10px;}
  #onlineArea{background:#1b1b1f;border-radius:10px;padding:10px;}

function loadSettings(){
  var out = {};
  for(var k in DEFAULTS) out[k]=DEFAULTS[k];
  try{
    var raw = safeStorage.getItem('flapyProsSettings');
    if(raw){
      var parsed = JSON.parse(raw);
      for(var k2 in parsed) out[k2]=parsed[k2];
    }
  }catch(e){}
  return out;
}

    for(var k in S) copy[k]=S[k];

/* ---------- CANVAS ---------- */
var canvas = document.getElementById('gameCanvas');
var ctx = canvas.getContext('2d');
var pixelCanvas = document.createElement('canvas');
var pixelCtx = pixelCanvas.getContext('2d');
var DPR = window.devicePixelRatio || 1;

function resizeCanvas(){
  var q = parseFloat(S.renderQuality) || 1;
  canvas.width = Math.floor(window.innerWidth * DPR * q);
  canvas.height = Math.floor(window.innerHeight * DPR * q);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
document.addEventListener('fullscreenchange', resizeCanvas);
resizeCanvas();

function updateCanvasFilter(){
  var f = '';
  if(S.colorblindMode === 'protanopia') f += 'sepia(0.3) saturate(0.6) ';
  else if(S.colorblindMode === 'deuteranopia') f += 'saturate(0.5) hue-rotate(-20deg) ';
  else if(S.colorblindMode === 'tritanopia') f += 'hue-rotate(60deg) saturate(0.7) ';
  if(S.highContrastMode) f += 'contrast(1.5) ';
  f += 'contrast('+S.contrast+') saturate('+S.saturation+') hue-rotate('+S.hueRotate+'deg) brightness('+S.ambientBrightness+') ';
  canvas.style.filter = f.trim();
}
updateCanvasFilter();

/* ---------- STATE ---------- */

var pipes = [];

function resetGame(){
  bird.x = Math.max(80, (canvas.width/DPR)*0.25);
  bird.y = (canvas.height/DPR)/2;
  bird.vy = 0;
  bird.r = S.birdSize;
  pipes = [];
  score = 0;
  pipeSpawnAccum = 0;
  afterimages = [];
  lastBotGapY = null;
  botMem.lastPipeRef = null;
  botMem.deciding = false;
}

function jumpDir(){ return S.reverseGravity ? -1 : 1; }

function flap(){
  if(state !== 'playing') return;
  var now = performance.now();
  if(now - lastFlapTime < S.flapCooldown) return;
  lastFlapTime = now;
  bird.vy = (S.reverseGravity ? S.jumpPower : -S.jumpPower);
  totalFlaps++;
  if(S.cameraShakeOnFlap) screenShakeTimer = Math.max(screenShakeTimer, 0.08);
  playTone('flap');
}

function spawnPipe(){
  var w = (canvas.width/DPR);
  var h = (canvas.height/DPR);
  var botAlign = S.botEnabled && S.botAlignPipes;
  var gap = S.pipeGap + (S.randomGap && !botAlign ? (Math.random()*60-30) : 0);
  gap = Math.max(70, gap);
  var margin = 60;
  var gapY;
  if(botAlign){
    if(lastBotGapY === null) lastBotGapY = h/2 - gap/2;
    gapY = lastBotGapY + (Math.random()*60-30);
    gapY = Math.max(margin, Math.min(h - margin - gap, gapY));
    lastBotGapY = gapY;
  } else {
    gapY = margin + Math.random() * Math.max(10, (h - margin*2 - gap));
  }
  var pw = S.pipeWidth + (S.pipeWidthVariance ? (Math.random()*S.pipeWidthVariance*2 - S.pipeWidthVariance) : 0);
  pipes.push({x:w+50, gapY:gapY, gap:gap, w:Math.max(20,pw), passed:false, baseGapY:gapY, phase:Math.random()*Math.PI*2});
}

function nextPipe(){
  for(var i=0;i<pipes.length;i++){
    if(pipes[i].x + pipes[i].w > bird.x) return pipes[i];
  }
  return null;
}

/* ---------- AUDIO ---------- */
var actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function playTone(kind){
  if(S.muted || !S.sfxEnabled) return;
  ensureAudio();
  if(!actx) return;
  var o = actx.createOscillator();
  var g = actx.createGain();
  var freq = 440;
  if(kind==='flap') freq = 500;
  if(kind==='score') freq = 800;
  if(kind==='death') freq = 150;
  o.type = S.eightBitMode ? 'square' : 'sine';
  o.frequency.value = freq * S.pitchMult;
  g.gain.value = 0.15 * S.masterVolume * S.sfxVolume;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
  o.stop(actx.currentTime + 0.21);
}
var musicTimer = null;
function startMusic(){
  if(musicTimer || !S.musicEnabled || S.muted) return;
  ensureAudio();
  if(!actx) return;
  var notes = [262,330,392,523];
  var idx = 0;
  musicTimer = setInterval(function(){
    if(!actx) return;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'triangle';
    o.frequency.value = notes[idx % notes.length] * S.pitchMult;
    g.gain.value = 0.08 * S.masterVolume * S.musicVolume;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
    o.stop(actx.currentTime + 0.42);
    idx++;
  }, 450);
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

/* ---------- COLLISION / SCORE ---------- */
function checkCollisions(){
  var h = canvas.height/DPR;
  if(S.godMode) return;
  if(S.ceilingCollision && bird.y - bird.r < 0){ triggerDeath(); return; }
  if(S.groundCollision && bird.y + bird.r > h - 50){ triggerDeath(); return; }
  for(var i=0;i<pipes.length;i++){
    var p = pipes[i];
    if(bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w){
      if(bird.y - bird.r < p.gapY || bird.y + bird.r > p.gapY + p.gap){
        triggerDeath(); return;
      }
    }
  }
}
function addScore(n){
  score += n * S.scoreMultiplier;
  playTone('score');
  mpSend({t:'score', v:score});
  flashAlpha = S.flashOnScore ? 0.3 : 0;
  if(S.botEnabled && S.botCelebrateOnScore) botMem.celebrateTimer = 0.5;
}
function triggerDeath(){
  if(state !== 'playing') return;
  if(S.infiniteLives){ resetGame(); return; }
  state = 'dead';
  totalDeaths++;
  scoresHistory.push(score);
  playTone('death');
  mpSend({t:'dead'});
  if(score > best){ best = Math.floor(score); try{ safeStorage.setItem('flapyBest', best); }catch(e){} }
  document.getElementById('finalScore').textContent = 'Score: ' + Math.floor(score) + '  Best: ' + best;
  document.getElementById('over').classList.remove('hidden');
  if(S.screenShakeEnabled && S.cameraShakeOnDeath) screenShakeTimer = 0.4;
  if(S.autoRestart){ setTimeout(function(){ if(state==='dead'){ startGame(); } }, 900); }
}

/* ---------- BOT (human-mimic + safety net) ---------- */
var botMem = { lastPipeRef:null, perTargetOffset:0, deciding:false, decisionStartTime:0, celebrateTimer:0, blinkTimer:0 };

function botThink(dt){
  if(!S.botEnabled || state !== 'playing') return;
  var pipe = nextPipe();
  if(!pipe) return;

  if(pipe !== botMem.lastPipeRef){
    botMem.lastPipeRef = pipe;
    var accuracyErr = (100 - S.botAccuracy) / 100;
    botMem.perTargetOffset = (Math.random()*2 - 1) * (8 + accuracyErr * 55);
    botMem.deciding = false;
  }

  var gapTop = pipe.gapY, gapBottom = pipe.gapY + pipe.gap;
  var center = (gapTop + gapBottom) / 2 + botMem.perTargetOffset;
  var tolerance = 14 + (100 - S.botAccuracy) * 0.35;

  // --- SAFETY NET (always on, strength scales with accuracy) ---
  var g = (S.reverseGravity ? -S.gravity : S.gravity);
  var lookaheadT = 0.22;
  var predY = bird.y + bird.vy*lookaheadT + 0.5*g*lookaheadT*lookaheadT;
  var h = canvas.height/DPR;
  var inPipeZone = (pipe.x - bird.x) < 170;
  var safetyStrength = S.botAccuracy / 100;
  var danger = false;
  if(inPipeZone && predY + bird.r > gapBottom - 8) danger = true;
  if(inPipeZone && predY - bird.r < gapTop + 8 && bird.vy < 0 && S.reverseGravity) danger = true;
  if(bird.y + bird.r > h - 70) danger = true;
  if(bird.y - bird.r < 10 && S.reverseGravity) danger = true;

  if(danger && Math.random() < safetyStrength){
    flap();
    botMem.deciding = false;
    return;
  }

  // --- HUMAN-LIKE DECISION LAYER ---
  var wantsFlap = S.reverseGravity ? (bird.y < center - tolerance*0.3) : (bird.y > center + tolerance*0.3);

  if(!wantsFlap && S.botOvershootChance > 0 && Math.random() < S.botOvershootChance * (1 - S.botConfidence) * dt * 4){
    wantsFlap = true;
  }

  if(wantsFlap && !botMem.deciding){
    botMem.deciding = true;
    botMem.decisionStartTime = performance.now();
    if(S.botHesitation && Math.random() < 0.12){
      botMem.deciding = false;
      return;
    }
  }
  if(botMem.deciding){
    var elapsed = performance.now() - botMem.decisionStartTime;
    var reaction = S.botHumanMimic ? S.botReactionTimeMs : 0;
    if(elapsed >= reaction){
      flap();
      botMem.deciding = false;
    }
  }
  if(!wantsFlap) botMem.deciding = false;
}

/* ---------- WEATHER ---------- */
function updateWeather(dt){
  if(!S.particlesEnabled || S.reduceMotion || S.weather === 'none') return;
  var w = canvas.width/DPR, h = canvas.height/DPR;
  if(Math.random() < (S.weather==='rain'?0.6:0.3)){
    weatherParticles.push({
      x: Math.random()*w, y:-10,
      vy: S.weather==='rain' ? S.rainSpeed+Math.random()*200 : 40+Math.random()*40,
      vx: S.weather==='snow' ? (Math.random()*40-20) : Math.tan(S.rainAngle*Math.PI/180)*-200,
      size: S.weather==='snow' ? 2+Math.random()*(2+S.snowflakeSizeVariance) : 1
    });
  }
  for(var i=weatherParticles.length-1;i>=0;i--){
    var p = weatherParticles[i];
    p.y += p.vy*dt; p.x += p.vx*dt;
    if(p.y > h) weatherParticles.splice(i,1);
  }
  if(weatherParticles.length > 400) weatherParticles.splice(0, weatherParticles.length-400);
}
function drawWeatherParticles(){
  if(!S.particlesEnabled || S.weather==='none') return;
  ctx.save();
  ctx.scale(DPR,DPR);
  if(S.weather === 'rain'){
    ctx.strokeStyle = 'rgba(200,220,255,0.6)';
    ctx.lineWidth = 1;
    weatherParticles.forEach(function(p){
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-4,p.y+14); ctx.stroke();
    });
  } else if(S.weather === 'snow'){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    weatherParticles.forEach(function(p){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
    });
  }
  ctx.restore();
}

/* ---------- UPDATE ---------- */
function update(dt){
  if(S.slowMoNearMiss){
    var np = nextPipe();
    if(np && Math.abs((np.x)-bird.x) < 40) dt *= 0.5;
  }
  var g = (S.reverseGravity ? -S.gravity : S.gravity);
  if(!S.autoFlap) bird.vy += g*dt;
  else bird.vy = Math.sin(performance.now()/200) * S.jumpPower * 0.5;

  if(S.windForce) bird.vy += Math.sin(performance.now()/500) * S.windForce * dt;

  var maxFall = S.maxFallSpeed, maxRise = -S.maxRiseSpeed;
  if(bird.vy > maxFall) bird.vy = maxFall;
  if(bird.vy < maxRise) bird.vy = maxRise;

  bird.y += bird.vy*dt;
  bird.rot = Math.max(-30,Math.min(90, bird.vy*0.08)) * S.rotationSpeedMult;
  if(S.oscillationEnabled) bird.y += Math.sin(performance.now()/150) * S.oscillationAmount * dt;

  botThink(dt);

  var speed = S.pipeSpeed * S.gameSpeed;
  pipeSpawnAccum += speed*dt;
  var spawnDist = Math.max(180, 380 * S.pipeSpacing);
  if((pipes.length === 0 || pipeSpawnAccum >= spawnDist) && pipes.length < S.pipeCountLimit){
    spawnPipe();
    pipeSpawnAccum = 0;
  }

  var w = canvas.width/DPR;
  var h = canvas.height/DPR;
  var botAlign = S.botEnabled && S.botAlignPipes;
  for(var i=pipes.length-1;i>=0;i--){
    var p = pipes[i];
    p.x -= speed*dt;
    if(S.movingPipes && !botAlign){
      p.phase += dt*(S.pipeMoveSpeed/40);
      if(S.pipeMovePattern === 'sine'){
        p.gapY = p.baseGapY + Math.sin(p.phase)*S.pipeMoveAmplitude;
      } else if(S.pipeMovePattern === 'linear'){
        p.gapY += Math.sin(p.phase)>0 ? 10*dt*S.pipeMoveSpeed/40 : -10*dt*S.pipeMoveSpeed/40;
      } else if(S.pipeMovePattern === 'random'){
        p.gapY += (Math.random()*2-1)*S.pipeMoveAmplitude*dt;
      }
      p.gapY = Math.max(30, Math.min(h-130-p.gap, p.gapY));
    }
    if(S.magnetPipesAway && Math.abs(p.x-bird.x) < 100){
      p.gapY += (bird.y - (p.gapY+p.gap/2)) * dt * 0.5;
    }
    if(!p.passed && p.x + p.w < bird.x){
      p.passed = true;
      addScore(1);
    }
    if(p.x + p.w < -60) pipes.splice(i,1);
  }

  if(S.trailEnabled && S.particlesEnabled && !S.reduceMotion){
    afterimages.push({x:bird.x,y:bird.y,life:0.4});
  }
  for(var j=afterimages.length-1;j>=0;j--){
    afterimages[j].life -= dt;
    if(afterimages[j].life <= 0) afterimages.splice(j,1);
  }
  if(botMem.celebrateTimer > 0) botMem.celebrateTimer -= dt;

  updateWeather(dt);
  checkCollisions();
  if(flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt*0.8);
  if(screenShakeTimer > 0) screenShakeTimer = Math.max(0, screenShakeTimer - dt);

  mpSend({t:'pos', y:bird.y});
}

function idleMenuUpdate(dt){
  updateWeather(dt*0.3);
}

/* ---------- DRAW ---------- */
function drawSky(){
  var w = canvas.width/DPR, h = canvas.height/DPR;

  else if(S.skyTheme === 'night'){ top='#0b1026'; bot='#1b2a4a'; }

  var grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, top); grad.addColorStop(1, bot);

  ctx.fillRect(0,0,w,h);

  // time-of-day darkening overlay
  var nightFactor = Math.max(0, Math.sin((S.timeOfDay/24)*Math.PI*2 - Math.PI/2)) * -1;
  var darken = Math.max(0, (6 - Math.min(Math.abs(S.timeOfDay-0), Math.abs(S.timeOfDay-24)))/6);
  if(S.timeOfDay < 6 || S.timeOfDay > 20){

  }

  if(S.skyTheme === 'night' || S.skyTheme === 'space'){

    for(var i=0;i<S.starCount;i++){

      ctx.fillRect(sx,sy,2,2);
    }
    ctx.globalAlpha = 1;
    if(S.moonVisible){
      ctx.fillStyle = '#eee';

    }
  }
  if(S.skyTheme === 'day' && S.sunGlow){

    ctx.restore();
  }
  if(S.fogEnabled){
    var fgrad = ctx.createLinearGradient(0,h*0.5,0,h-50);
    fgrad.addColorStop(0,'rgba(0,0,0,0)');
    var c = S.fogColor;
    fgrad.addColorStop(1, hexToRgba(c, S.fogDensity));
    ctx.fillStyle = fgrad;
    ctx.fillRect(0,h*0.5,w,h*0.5-50);
  }
  if(S.auroraEnabled && (S.skyTheme==='night'||S.skyTheme==='space')){

    ctx.globalAlpha = 0.25;
    var ag = ctx.createLinearGradient(0,0,0,h*0.4);
    ag.addColorStop(0,'#00ff99'); ag.addColorStop(1,'rgba(0,255,153,0)');

    ctx.restore();

function hexToRgba(hex, a){
  var r=0,g=0,b=0;
  if(hex.length===7){ r=parseInt(hex.substr(1,2),16); g=parseInt(hex.substr(3,2),16); b=parseInt(hex.substr(5,2),16); }
  return 'rgba('+r+','+g+','+b+','+a+')';
}
var cloudOffsets = [];
function drawClouds(){
  if(!S.backgroundParallax || S.reduceMotion) return;

  ctx.save(); ctx.scale(DPR,DPR);

  for(var i=0;i<n;i++){
    if(cloudOffsets[i] === undefined) cloudOffsets[i] = Math.random()*w;
    cloudOffsets[i] -= S.cloudSpeed*0.005;

function drawGround(){
  var w = canvas.width/DPR, h = canvas.height/DPR;
  ctx.save(); ctx.scale(DPR,DPR);
  var top = S.groundTopColor, bot = S.groundBottomColor;
  if(S.groundTheme === 'sand'){ top='#e6d2a8'; bot='#c9ab6a'; }
  else if(S.groundTheme === 'snow'){ top='#ffffff'; bot='#dce6f0'; }
  else if(S.groundTheme === 'city'){ top='#777'; bot='#444'; }
  var grad = ctx.createLinearGradient(0,h-50,0,h);
  grad.addColorStop(0, top); grad.addColorStop(1, bot);

  ctx.fillStyle = 'rgba(0,0,0,0.15)';

  }
  if(S.cityDensity > 0 && S.groundTheme === 'city'){
    ctx.fillStyle = 'rgba(40,40,50,0.5)';
    for(var bx=0; bx<w; bx+=w/S.cityDensity){
      var bh = 20 + ((bx*13)%40);
      ctx.fillRect(bx, h-50-bh, w/S.cityDensity-4, bh);
    }
  }
  ctx.restore();
}
function pipeColorFor(part){
  if(S.pipeRainbow){
    var hue = (performance.now()/10) % 360;
    return 'hsl('+hue+',70%,50%)';
  }
  if(S.pipeTheme === 'metal') return part==='body'?'#90a4ae':(part==='cap'?'#546e7a':(part==='hl'?'#cfd8dc':'#37474f'));
  if(S.pipeTheme === 'candy') return part==='body'?'#f06292':(part==='cap'?'#c2185b':(part==='hl'?'#f8bbd0':'#880e4f'));
  if(S.pipeTheme === 'neon') return part==='body'?'#39ff14':(part==='cap'?'#00ffff':(part==='hl'?'#aaffaa':'#008800'));
  return part==='body'?S.pipeColorBody:(part==='cap'?S.pipeColorCap:(part==='hl'?S.pipeColorHighlight:S.pipeColorShadow));
}
function drawPipeRect(x,y,w,h){
  ctx.beginPath();
  if(S.pipeRoundedCorners && w>0 && h>0){
    var r = Math.min(10, w/3, h/3);
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.rect(x,y,w,h);
    ctx.fill();
  }
  if(S.pipeOutlineEnabled){
    ctx.strokeStyle = S.pipeOutlineColor;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
function drawPipes(){
  var h = canvas.height/DPR;
  ctx.save(); ctx.scale(DPR,DPR);
  ctx.globalAlpha = S.pipeTransparency;
  pipes.forEach(function(p){
    if(S.glowEnabled || S.bloomEnabled){ ctx.shadowColor = S.pipeGlowColor; ctx.shadowBlur = 16; } else { ctx.shadowBlur = 0; }
    ctx.fillStyle = pipeColorFor('body');
    drawPipeRect(p.x, 0, p.w, p.gapY);
    drawPipeRect(p.x, p.gapY+p.gap, p.w, h-50-(p.gapY+p.gap));
    ctx.fillStyle = pipeColorFor('cap');
    var capH = S.pipeCapStyle === 'spike' ? 28 : 20;
    if(S.pipeCapStyle !== 'flat'){
      ctx.fillRect(p.x-4, p.gapY-capH, p.w+8, capH);
      ctx.fillRect(p.x-4, p.gapY+p.gap, p.w+8, capH);
    }
    ctx.fillStyle = pipeColorFor('hl');
    ctx.fillRect(p.x+4, 0, 6, p.gapY);
    ctx.shadowBlur = 0;
    if(S.hitboxEnabled){
      ctx.strokeStyle = '#ff0000';
      ctx.strokeRect(p.x,0,p.w,p.gapY);
      ctx.strokeRect(p.x,p.gapY+p.gap,p.w,h-50-(p.gapY+p.gap));
    }
    if(S.doublePipesMode){
      ctx.globalAlpha = S.pipeTransparency*0.3;
      ctx.fillStyle = pipeColorFor('body');
      ctx.fillRect(p.x+10, 0, p.w, Math.max(0,p.gapY-20));
      ctx.fillRect(p.x+10, p.gapY+p.gap+20, p.w, Math.max(0,h-50-(p.gapY+p.gap+20)));
      ctx.globalAlpha = S.pipeTransparency;
    }
  });
  ctx.globalAlpha = 1;

function drawTrail(){

function drawShapePath(shape, r){
  ctx.beginPath();
  if(shape === 'square'){ ctx.rect(-r,-r,r*2,r*2); }
  else if(shape === 'diamond'){ ctx.moveTo(0,-r); ctx.lineTo(r,0); ctx.lineTo(0,r); ctx.lineTo(-r,0); ctx.closePath(); }
  else if(shape === 'star'){
    for(var i=0;i<10;i++){
      var ang = (Math.PI/5)*i - Math.PI/2;
      var rad = i%2===0 ? r : r*0.5;
      var px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  } else { ctx.arc(0,0,r,0,7); }
}

function drawBotPath(){
  if(!S.botEnabled || !S.botPathVisualization) return;
  var p = nextPipe(); if(!p) return;
  ctx.save(); ctx.scale(DPR,DPR);
  ctx.strokeStyle = 'rgba(0,255,0,0.5)';
  ctx.beginPath(); ctx.moveTo(bird.x,bird.y); ctx.lineTo(p.x+p.w/2, p.gapY+p.gap/2); ctx.stroke();
  ctx.restore();
}

/* post effects */
function applyCameraTransform(){
  if(S.cameraZoom === 1 && S.cameraRotation === 0 && S.cameraOffsetX===0 && S.cameraOffsetY===0) return;
  var w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.translate(w/2 + S.cameraOffsetX*DPR, h/2 + S.cameraOffsetY*DPR);
  ctx.rotate(S.cameraRotation*Math.PI/180);
  ctx.scale(S.cameraZoom,S.cameraZoom);
  ctx.translate(-w/2,-h/2);
  ctx.drawImage(canvas,0,0);
  ctx.restore();
}
function applyMirror(){
  if(!S.mirrorScreen) return;
  ctx.save();
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(canvas,0,0);
  ctx.restore();
}
function applyScreenShake(){
  if(!S.screenShakeEnabled || screenShakeTimer <= 0) return;
  var ox = (Math.random()-0.5)*S.screenShakeIntensity*DPR;
  var oy = (Math.random()-0.5)*S.screenShakeIntensity*DPR;
  ctx.save();
  ctx.drawImage(canvas, ox, oy);
  ctx.restore();
}
function applyPixelation(){
  if(S.pixelation <= 1) return;
  var w = Math.max(1, Math.floor(canvas.width / S.pixelation));
  var h = Math.max(1, Math.floor(canvas.height / S.pixelation));
  pixelCanvas.width = w; pixelCanvas.height = h;
  pixelCtx.imageSmoothingEnabled = false;
  pixelCtx.drawImage(canvas,0,0,w,h);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(pixelCanvas,0,0,w,h,0,0,canvas.width,canvas.height);
  ctx.imageSmoothingEnabled = true;
}
function applyChromaticAberration(){
  if(S.chromaticAberration <= 0) return;
  var off = S.chromaticAberration*DPR;
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.globalCompositeOperation = 'screen';
  ctx.drawImage(canvas, -off, 0);
  ctx.drawImage(canvas, off, 0);
  ctx.restore();
}
function applyBloom(){
  if(!S.bloomEnabled) return;
  ctx.save();
  ctx.filter = 'blur(' + (S.bloomStrength/5) + 'px)';
  ctx.globalAlpha = 0.35;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(canvas,0,0);
  ctx.restore();
}
function applyInvert(){
  if(!S.invertColors) return;
  ctx.save();
  ctx.filter = 'invert(1)';
  ctx.drawImage(canvas,0,0);
  ctx.restore();
}
function drawGrid(){
  ctx.save(); ctx.scale(DPR,DPR);
  ctx.strokeStyle = S.gridColor; ctx.globalAlpha = 0.3;
  var w = canvas.width/DPR, h = canvas.height/DPR;
  for(var x=0;x<w;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(var y=0;y<h;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawVignette(){
  var w = canvas.width, h = canvas.height;
  var grad = ctx.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.75);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,'+S.vignetteStrength+')');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
}
function drawScanlines(){
  ctx.save();
  ctx.globalAlpha = S.scanlineOpacity;
  ctx.fillStyle = '#000';
  for(var y=0;y<canvas.height;y+=4*DPR){ ctx.fillRect(0,y,canvas.width,1*DPR); }
  ctx.restore();
}

function drawHUD(){
  ctx.save(); ctx.scale(DPR,DPR);
  if(state === 'playing' || state === 'dead'){
    ctx.font = (S.scoreSize) + 'px ' + S.scoreFont;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    var txt = Math.floor(score);
    ctx.strokeText(txt, (canvas.width/DPR)/2, 70);
    ctx.fillText(txt, (canvas.width/DPR)/2, 70);
    if(S.comboDisplay){
      ctx.font = '14px sans-serif';
      ctx.fillText('x'+S.scoreMultiplier, (canvas.width/DPR)/2, 95);
    }
  }
  ctx.restore();

  var fpsHud = document.getElementById('fpsHud');
  var debugHud = document.getElementById('debugHud');
  var statsHud = document.getElementById('statsHud');
  if(S.fpsCounterVisible){ fpsHud.classList.remove('hidden'); fpsHud.textContent = 'FPS: ' + fpsValue; }
  else fpsHud.classList.add('hidden');

  if(S.debugOverlay){
    debugHud.classList.remove('hidden');
    debugHud.textContent =
      'FPS: '+fpsValue+'\n'+
      'Pos: '+Math.round(bird.x)+','+Math.round(bird.y)+'\n'+
      'VelY: '+Math.round(bird.vy)+'\n'+
      'Score: '+Math.floor(score)+'  Best: '+best+'\n'+
      'State: '+state+'\n'+
      'Lag: '+S.lagLevel+'  InputLag: '+S.inputLagMs+'ms\n'+
      'Gravity: '+S.gravity+' Jump: '+S.jumpPower+' PipeSpd: '+S.pipeSpeed+'\n'+
      'Res: '+canvas.width+'x'+canvas.height+' DPR:'+DPR+'\n'+
      'Bot: '+S.botEnabled+' ('+S.botAccuracy+'%)  God: '+S.godMode+'\n'+
      'MP: '+(mpConnected?'Connected':'Offline');
  } else debugHud.classList.add('hidden');

  var showStats = S.showSessionStats||S.showTotalFlaps||S.showTotalDeaths||S.showPlayTime||S.showAverageScore||S.showAccuracyPercent;
  if(showStats){
    statsHud.classList.remove('hidden');
    var lines = [];
    if(S.showTotalFlaps) lines.push('Flaps: '+totalFlaps);
    if(S.showTotalDeaths) lines.push('Deaths: '+totalDeaths);
    if(S.showPlayTime) lines.push('Time: '+Math.floor((Date.now()-sessionStart)/1000)+'s');
    if(S.showAverageScore){
      var avg = scoresHistory.length ? (scoresHistory.reduce(function(a,b){return a+b;},0)/scoresHistory.length) : 0;
      lines.push('Avg: '+avg.toFixed(1));
    }
    if(S.showAccuracyPercent) lines.push('BotAcc: '+S.botAccuracy+'%');
    statsHud.textContent = lines.join('\n');
  } else statsHud.classList.add('hidden');

  if(S.showCoords){
    ctx.save(); ctx.scale(DPR,DPR);
    ctx.fillStyle = '#0ff'; ctx.font='10px monospace'; ctx.textAlign='left';
    ctx.fillText(Math.round(bird.x)+','+Math.round(bird.y), bird.x+15, bird.y);
    ctx.restore();
  }
  if(S.showVelocityVectors){
    ctx.save(); ctx.scale(DPR,DPR);
    ctx.strokeStyle='#ff0';
    ctx.beginPath(); ctx.moveTo(bird.x,bird.y); ctx.lineTo(bird.x, bird.y+bird.vy*0.1); ctx.stroke();
    ctx.restore();
  }
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSky();
  drawClouds();
  drawWeatherParticles();
  drawGround();
  drawPipes();
  drawTrail();
  drawBird();
  drawPeerGhost();
  drawBotPath();

  applyCameraTransform();
  applyMirror();
  applyScreenShake();
  applyPixelation();
  applyChromaticAberration();
  applyBloom();
  applyInvert();

  if(S.gridOverlay) drawGrid();
  if(S.vignetteEnabled) drawVignette();
  if(S.scanlinesEnabled) drawScanlines();
  if(flashAlpha > 0){
    ctx.fillStyle = 'rgba(255,255,255,'+flashAlpha+')';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  drawHUD();
}

/* ---------- LOOP ---------- */
var lagSkipTable = [1,2,4,8,16];
function trackFPS(now){
  fpsFrames++;
  if(now - fpsLast >= 1000){
    fpsValue = fpsFrames;
    fpsFrames = 0;
    fpsLast = now;
  }
}
function loop(now){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime = now;
  var minInterval = 1000 / Math.max(1,S.targetFPSCap);
  if(now - lastTime < minInterval) return;
  var dt = Math.min(0.1, (now - lastTime)/1000);
  lastTime = now;

  var skip = lagSkipTable[S.lagLevel] || 1;
  lagCounter++;
  if(skip > 1 && (lagCounter % skip !== 0)) { trackFPS(now); render(); return; }
  if(S.simulateStutter && Math.random() < 0.02) { trackFPS(now); render(); return; }

  dt *= S.gameSpeed;
  if(state === 'playing') update(dt);
  else if(state === 'menu') idleMenuUpdate(dt);

  render();
  trackFPS(now);
}
requestAnimationFrame(loop);

/* ---------- SKINS SCREEN ---------- */
function renderSkinsGrid(){
  var grid = document.getElementById('skinGrid');
  grid.innerHTML = '';
  SKINS.forEach(function(sk, i){
    var card = document.createElement('div');
    card.className = 'skinCard' + (i===S.currentSkin?' selected':'') + (!skinUnlocked(i)?' locked':'');
    var c = document.createElement('canvas');
    c.width = 60; c.height = 60;
    var cctx = c.getContext('2d');
    cctx.fillStyle = sk.body;
    if(sk.shape === 'custom' && customSkinImg.complete && customSkinImg.naturalWidth){
      cctx.drawImage(customSkinImg,10,10,40,40);
    } else {
      cctx.beginPath();
      if(sk.shape === 'square') cctx.rect(14,14,32,32);
      else if(sk.shape === 'diamond'){ cctx.moveTo(30,10); cctx.lineTo(50,30); cctx.lineTo(30,50); cctx.lineTo(10,30); cctx.closePath(); }
      else if(sk.shape === 'star'){
        for(var k=0;k<10;k++){ var ang=(Math.PI/5)*k-Math.PI/2; var rad=k%2===0?20:10; var px=30+Math.cos(ang)*rad, py=30+Math.sin(ang)*rad; if(k===0) cctx.moveTo(px,py); else cctx.lineTo(px,py); }
        cctx.closePath();
      } else cctx.arc(30,30,20,0,7);
      cctx.fill();
    }
    card.appendChild(c);
    var label = document.createElement('div');
    label.textContent = sk.name + (!skinUnlocked(i) ? ' 🔒 '+skinRequiredScore(i) : '');
    card.appendChild(label);
    card.onclick = function(){
      if(!skinUnlocked(i)) return;
      S.currentSkin = i;
      persistSettings();
      renderSkinsGrid();
    };
    grid.appendChild(card);
  });
}
document.getElementById('skinsBtn').onclick = function(){
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('skinsScreen').classList.remove('hidden');
  renderSkinsGrid();
};
document.getElementById('skinsBackBtn').onclick = function(){
  document.getElementById('skinsScreen').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
};
document.getElementById('skinUploadBtn').onclick = function(){
  document.getElementById('skinFileInput').click();
};
document.getElementById('skinFileInput').onchange = function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    customSkinImg.src = ev.target.result;
    saveCustomSkin(ev.target.result);
    S.currentSkin = SKINS.length - 1;
    persistSettings();
    renderSkinsGrid();
  };
  reader.readAsDataURL(file);
};

var currentTab = 'graphics';

function buildTab(cat){
  var html = '';
  controlsConfig.filter(function(c){return c.cat===cat;}).forEach(function(c){
    var key = c.key;
    var val = S[key];
    html += '<div class="ctrlRow">';
    html += '<label>'+c.label+(c.type==='range'?'<span class="valSpan" id="val_'+key+'">'+val+'</span>':'')+'</label>';
    if(c.type === 'toggle'){
      html += '<input type="checkbox" data-key="'+key+'" data-type="toggle" '+(val?'checked':'')+'>';
    } else if(c.type === 'range'){
      html += '<input type="range" data-key="'+key+'" data-type="range" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+val+'">';
    } else if(c.type === 'select'){
      html += '<select data-key="'+key+'" data-type="select">';
      c.options.forEach(function(o){ html += '<option value="'+o+'" '+(String(o)===String(val)?'selected':'')+'>'+o+'</option>'; });
      html += '</select>';
    } else if(c.type === 'color'){
      html += '<input type="color" data-key="'+key+'" data-type="color" value="'+val+'">';
    } else if(c.type === 'text'){
      html += '<input type="text" data-key="'+key+'" data-type="text" value="'+val+'">';
    }
    html += '</div>';
  });
  return html;
}

function applyPreset(name){
  if(name === 'easy'){ S.pipeGap=240; S.pipeSpeed=140; S.gravity=850; S.jumpPower=340; S.pipeSpacing=2; }
  else if(name === 'normal'){ S.pipeGap=190; S.pipeSpeed=180; S.gravity=1000; S.jumpPower=360; S.pipeSpacing=1.6; }
  else if(name === 'hard'){ S.pipeGap=150; S.pipeSpeed=240; S.gravity=1150; S.jumpPower=380; S.pipeSpacing=1.3; }
  else if(name === 'insane'){ S.pipeGap=110; S.pipeSpeed=320; S.gravity=1300; S.jumpPower=400; S.pipeSpacing=1.1; }
  else if(name === 'troll'){ S.reverseGravity=!S.reverseGravity; S.lagLevel=2; S.invertColors=true; }
  else if(name === 'pro'){ S.glowEnabled=true; S.trailEnabled=true; S.particlesEnabled=true; S.pipeTheme='neon'; }
  else if(name === 'botshow'){ S.botEnabled=true; S.botAccuracy=100; S.botAlignPipes=true; S.botHumanMimic=true; S.botReactionTimeMs=140; }
  else if(name === 'resetall'){ for(var k in DEFAULTS) S[k]=DEFAULTS[k]; }
  persistSettings();
  updateCanvasFilter();
  renderTab(currentTab);
}

function renderTab(cat){
  currentTab = cat;
  var body = document.getElementById('adminBody');
  if(cat === 'mpsettings'){
    body.innerHTML = buildTab(cat);
  } else if(cat === 'cheats'){
    body.innerHTML = buildTab(cat) + cheatsExtraHTML();
    wireCheatButtons();
  } else if(cat === 'stats'){
    body.innerHTML = buildTab(cat) + statsExtraHTML();
    document.getElementById('btnResetStats').onclick = function(){
      totalFlaps=0; totalDeaths=0; scoresHistory=[]; sessionStart=Date.now();
    };
  } else if(cat === 'presets'){
    body.innerHTML = presetsHTML();
    Array.prototype.forEach.call(body.querySelectorAll('[data-preset]'), function(btn){
      btn.onclick = function(){ applyPreset(btn.dataset.preset); };
    });
  } else {
    body.innerHTML = buildTab(cat);
  }
  document.querySelectorAll('.tabBtn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===cat); });
  body.querySelectorAll('[data-key]').forEach(function(input){
    input.addEventListener('input', function(){
      var key = input.dataset.key, type = input.dataset.type;
      var v;
      if(type === 'toggle') v = input.checked;
      else if(type === 'range') v = parseFloat(input.value);
      else v = input.value;
      S[key] = v;
      var span = document.getElementById('val_'+key);
      if(span) span.textContent = v;
      if(key === 'renderQuality') resizeCanvas();
      if(key === 'musicEnabled'){ if(v) startMusic(); else stopMusic(); }
      if(key === 'muted' && v){ stopMusic(); }
      if(['colorblindMode','highContrastMode','contrast','saturation','hueRotate','ambientBrightness'].indexOf(key) !== -1) updateCanvasFilter();
      persistSettings();
    });
  });
}

function wireCheatButtons(){
  document.getElementById('btnAdd10').onclick = function(){ score += 10; };
  document.getElementById('btnSetScore').onclick = function(){
    var v = prompt('Set score to:', Math.floor(score));

    if(!confirm('Reset ALL settings to default?')) return;

    updateCanvasFilter();
    renderTab(currentTab);
  };
  document.getElementById('btnExport').onclick = function(){
    prompt('Copy settings JSON:', JSON.stringify(S));
  };

      persistSettings();
      updateCanvasFilter();
      renderTab(currentTab);
    }catch(e){ alert('Invalid JSON'); }
  };
}

/* ---------- MULTIPLAYER (WebRTC manual code) ---------- */
var pc = null, dc = null, mpConnected = false;
var peerState = {y:null};
function wireMpUI(){
  document.getElementById('mpHostBtn').onclick = mpHost;
  document.getElementById('mpJoinBtn').onclick = function(){
    document.getElementById('mpJoinArea').classList.remove('hidden');
    document.getElementById('mpHostArea').classList.add('hidden');
  };
  document.getElementById('mpGenAnswerBtn').onclick = mpGenAnswer;
  document.getElementById('mpFinishBtn').onclick = mpFinishConnect;
}
function setupDC(){
  dc.onopen = function(){
    mpConnected = true;
    var st = document.getElementById('mpStatus');
    if(st) st.textContent = 'Status: Connected! 🎮';
  };
  dc.onclose = function(){ mpConnected = false; };
  dc.onmessage = function(e){
    try{
      var msg = JSON.parse(e.data);
      if(msg.t === 'pos') peerState.y = msg.y;
    }catch(err){}
  };
}
function mpHost(){
  document.getElementById('mpHostArea').classList.remove('hidden');
  document.getElementById('mpJoinArea').classList.add('hidden');
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  dc = pc.createDataChannel('game');
  setupDC();
  pc.onicecandidate = function(e){
    if(e.candidate === null){
      document.getElementById('mpOfferOut').value = btoa(JSON.stringify(pc.localDescription));
    }
  };
  pc.createOffer().then(function(offer){ return pc.setLocalDescription(offer); });
}
function mpGenAnswer(){
  var offerCode = document.getElementById('mpOfferIn').value.trim();
  if(!offerCode) return;
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.ondatachannel = function(e){ dc = e.channel; setupDC(); };
  pc.onicecandidate = function(e){
    if(e.candidate === null){
      document.getElementById('mpAnswerOut').value = btoa(JSON.stringify(pc.localDescription));
    }
  };
  var offer = JSON.parse(atob(offerCode));
  pc.setRemoteDescription(offer).then(function(){
    return pc.createAnswer();
  }).then(function(answer){
    return pc.setLocalDescription(answer);
  });
}
function mpFinishConnect(){
  var answerCode = document.getElementById('mpAnswerIn').value.trim();
  if(!answerCode || !pc) return;
  var answer = JSON.parse(atob(answerCode));
  pc.setRemoteDescription(answer);
}
function mpSend(obj){
  if(!dc || dc.readyState !== 'open') return;
  if(S.packetLoss > 0 && Math.random()*100 < S.packetLoss) return;
  var delay = S.mpNetworkLatency + Math.random()*S.mpNetworkJitter;
  setTimeout(function(){
    try{ dc.send(JSON.stringify(obj)); }catch(e){}
  }, delay);
}
